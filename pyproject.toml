[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "capsule-diff"
version = "0.2.0"
description = "Deterministic structured context snapshot comparison"
requires-python = ">=3.11"

[project.scripts]
capsule-diff = "capsule_diff.cli:main"

[tool.setuptools.packages.find]
include = ["capsule_diff*"]

[tool.setuptools.package-data]
capsule_diff = ["*.json"]
